name: Portainer GitOps Update

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  cancel-in-progress: true
  group: gitops-${{github.ref}}

jobs:
  should_build:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
  build-docker-image:
    runs-on: ubuntu-latest
    needs: should_build
    if: ${{ needs.should_build.outputs.docker == true }}
    steps:
    - name: Build and push Docker images
      uses: docker/build-push-action@v7.1.0
      with:
        context: .
        # Path to the Dockerfile
        file: ./Dockerfile
        # List of target platforms for build
        # platforms: # optional
        push: true
        tags: sethicis/homebridge:latest,sethicis/homebridge:${{ github.sha }}
  trigger-portainer:
    needs: build-docker-image
    runs-on: ubuntu-latest
    # If the hook is defined, run the job, otherwise skip
    if: vars.PORTAINER_HOOK && !failure()
    steps:
      - name: Trigger Portainer webhook
        env:
          PORTAINER_HOOK: ${{ vars.PORTAINER_HOOK }}
        run: |
          if [ -z "$PORTAINER_HOOK" ]; then
            echo "PORTAINER_HOOK is not set"
            exit 1
          fi

          curl --fail --show-error --silent --request POST "$PORTAINER_HOOK"
